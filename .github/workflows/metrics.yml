name: Language Metrics

on:
  schedule:
    - cron: "0 6 * * *"   # once a day
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          # OpenSCAD models are huge files that crowd out every other language
          plugin_languages_ignored: html, css, jupyter notebook, openscad
          plugin_languages_details: percentage, lines
          config_timezone: America/Detroit
          # Temporary: prints per-repo analysis details to the run log
          debug: yes
          # Count repos you own, collaborate on, or belong to via an organization
          repositories_affiliations: owner, collaborator, organization_member
          # Include forks (senior design work lives in forks); with indepth mode,
          # only your own commits in them are counted
          repositories_forks: yes
          # Analyze only the code in your own commits, not each repo's whole codebase
          plugin_languages_indepth: yes
          # Big CAD/driver histories (OSHE-PnP, parking assistant) need more time per repo
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15
          # Upstream copy of my own OSHE-PnP fork; skip it so commits aren't analyzed twice
          plugin_languages_skipped: MatthewCompher/OSHE-PnP
          # Add other emails/usernames you've committed with, comma-separated
          commits_authoring: josephp-eng, jrpokuta@gmail.com, jrpokuta@mtu.edu
